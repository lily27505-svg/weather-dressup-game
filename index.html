<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>天氣穿衣小遊戲 - 完美放大版</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    /* 使用 dvh 以完美貼合 iOS Safari 工具列變化 */
    height: 100vh;
    height: 100dvh;
    overflow: hidden; /* 防止整個頁面外框被不小心拉動 */
    overscroll-behavior: none; /* 防止 iPad 邊緣回彈效果 */
    touch-action: none; /* 停用預設手勢 */
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f0f8ff;
    
    /* 置中排版 */
    display: flex; 
    flex-direction: column; 
    align-items: center; 
  }

  h3 { color: #333; margin-top: 10px; margin-bottom: 5px; }

  /* 🌟 遊戲主容器 */
  #game-container {
    display: flex; 
    gap: 20px; /* 稍微縮小間距適應平板 */
    margin-top: 10px;
    background: white; 
    padding: 20px; 
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    
    /* 🌟 iPad 適應關鍵：允許內容換行，高度不足時可在框內滑動 */
    flex-wrap: wrap; 
    justify-content: center;
    max-width: 98vw;
    max-height: 85dvh; 
    overflow-y: auto; 
    overflow-x: hidden;
    touch-action: pan-y; /* 允許在容器內上下滑動 */
  }

  /* 左側衣櫃區 */
  #wardrobe-wrapper {
    display: flex; 
    flex-direction: column; 
    align-items: center;
  }

  #wardrobe {
    width: 360px; /* 稍微收窄一點，讓 iPad 橫向更易放得落 */
    border: 3px dashed #ccc; border-radius: 10px;
    padding: 15px; background-color: #fafafa;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
    align-content: start;
    max-height: 600px; /* 配合 iPad 高度 */
    overflow-y: auto; 
-webkit-overflow-scrolling: touch; /* 🌟 讓 iPad 滾動更順滑 */
  }

  /* 預防圖片變形的關鍵設定 */
  .clothing img, .drop-zone img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  /* 衣服項目 */
  .clothing {
    width: 100%; 
    aspect-ratio: 1 / 1; 
    border-radius: 8px; 
    cursor: grab; 
    user-select: none;
    transition: transform 0.2s;
    box-sizing: border-box;
    background-color: transparent; 
    display: flex; justify-content: center; align-items: center; 
    font-weight: bold; color: #555; font-size: 14px;
    /* 防止觸控拖拉時畫面捲動 */
    touch-action: pan-y;
  }

  .clothing:active { 
    cursor: grabbing; 
    transform: scale(0.95);
    background-color: rgba(0,0,0,0.05); 
  }

  /* =========================================
     右側：人物 + 配飾區佈局
     ========================================= */
  #right-panel {
    display: flex; 
    gap: 20px; 
    align-items: flex-start;
    flex-wrap: wrap; /* 🌟 確保 iPad 直向時人物和配飾可以上下疊放 */
    justify-content: center;
  }

  #character-wrapper {
    display: flex; flex-direction: column; align-items: center;
  }

  .char-title { font-weight: bold; color: #333; margin-bottom: 15px; }

  #character {
    --s: 0.75;
    position: relative; 
    width: calc(396px * var(--s));
    height: calc(720px * var(--s));    
    background-image: url('whole_body.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center top;
  }

  /* 隱形接收區 (通用設定) */
  .drop-zone {
    position: absolute; 
    display: flex; justify-content: center; align-items: center;
    box-sizing: border-box;
    transition: all 0.3s;
  }

  .drop-zone.drag-over {
    background-color: rgba(255, 243, 204, 0.7);
    border-color: #ff9f43; border-style: dashed;
  }

/* 🌟 全新自動縮放人物設定 */
  #character {
    /* 👇 🌟 魔法參數：在這裡調整大小！
       0.8 代表 80%，0.75 代表 75%，1 代表 100%。您可以隨意更改這個數字測試！ */
    --s: 0.8;

    position: relative;
    width: calc(396px * var(--s));
    height: calc(720px * var(--s));
    background-image: url('whole_body.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center top;
  }

  /* 👇 以下所有隱形格仔都會跟隨上面的 --s 自動計算比例，絕不走位！ */
  #zone-head {
    top: calc(-100px * var(--s));
    left: 46%;
    transform: translateX(-50%);
    width: calc(244px * var(--s));
    height: calc(239px * var(--s));
    z-index: 3;
  }
  #zone-body {
    top: calc(150px * var(--s));
    left: 50%;
    transform: translateX(-50%);
    width: calc(340px * var(--s));
    height: calc(340px * var(--s));
    z-index: 2;
  }
  #zone-legs {
    top: calc(387px * var(--s));
    left: 50%;
    transform: translateX(-50%);
    width: calc(287px * var(--s));
    height: calc(287px * var(--s));
    z-index: 1;
  }
  #zone-glasses {
    top: calc(30px * var(--s));
    left: 50%;
    transform: translateX(-50%);
    width: calc(178px * var(--s));
    height: calc(178px * var(--s));
    z-index: 4;
  }
  /* 配飾區 */
  #accessories-wrapper {
    display: flex; flex-direction: column; align-items: center;
  }

#zone-accessory {
    position: static;
    width: 160px;
    height: 620px; /* 🌟 固定高度，與左邊衣櫃對齊 */
    overflow-y: auto; /* 🌟 加上捲軸，超出範圍可滾動 */
    touch-action: pan-y; /* 🌟 確保 iPad 可以在這個框內上下滑動 */

    border: 3px dashed #ccc; border-radius: 10px;
    background-color: #fdfdfd; padding: 15px;

    /* 🌟 改為雙排顯示，讓配飾自動縮小 */
    display: grid;
    grid-template-columns: repeat(1, 1fr);
    gap: 15px;
    align-content: start;
  }
  #reset-btn {
    margin-top: 5px;
    padding: 12px 24px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background-color: #ff6b6b; /* 鮮艷的紅色，吸引小朋友注意 */
    border: none;
    border-radius: 25px; /* 圓角設計 */
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: all 0.2s;
    touch-action: manipulation; /* 🌟 確保 iPad 點擊反應順暢，不會延遲 */
  }

  /* 點擊時的縮小動畫效果 */
  #reset-btn:active {
    transform: scale(0.95);
    background-color: #ff5252;
  }

  /* 針對 iPad 橫向解析度 (通常是 1024px 左右) */
  @media (max-width: 1100px) {
    #game-container {
      zoom: 0.85; /* 如果整個畫面太大，把它改成 0.8 或 0.75 */
    }
  }

</style>

</head>
<body>

  <h3>🌤️ 天氣穿衣小遊戲</h3>

  
  <div id="game-container">
    <!-- 左側衣櫃 -->
    <div id="wardrobe-wrapper">
      <div class="char-title">衣櫃 (請拖拉)</div>
    	<div id="wardrobe">
	   <img src="1.png" class="clothing" draggable="true" id="item-hat1" data-target="zone-head">
	   <img src="2.png" class="clothing" draggable="true" id="item-hat2" data-target="zone-head">
	   <img src="3.png" class="clothing" draggable="true" id="item-hat3" data-target="zone-head">
	   <img src="tops1.png" class="clothing" draggable="true" id="item-shirt1" data-target="zone-body">
	   <img src="tops2.png" class="clothing" draggable="true" id="item-shirt2" data-target="zone-body">
	   <img src="tops3.png" class="clothing" draggable="true" id="item-shirt3" data-target="zone-body">
	   <img src="tops4.png" class="clothing" draggable="true" id="item-shirt4" data-target="zone-body">
	   <img src="tops5.png" class="clothing" draggable="true" id="item-shirt5" data-target="zone-body">
	   <img src="bottom1.png" class="clothing" draggable="true" id="item-pants1" data-target="zone-legs">
	   <img src="bottom2.png" class="clothing" draggable="true" id="item-pants2" data-target="zone-legs">
	   <img src="bottom3.png" class="clothing" draggable="true" id="item-pants3" data-target="zone-legs">
	   <img src="bottom4.png" class="clothing" draggable="true" id="item-pants4" data-target="zone-legs">
	   <img src="glasses1.png" class="clothing" draggable="true" id="item-glasses1" data-target="zone-glasses">
	   <img src="accessory1.png" class="clothing" draggable="true" id="item-accessory1" data-target="accessory">
	   <img src="accessory2.png" class="clothing" draggable="true" id="item-accessory2" data-target="accessory">
	   <img src="accessory3.png" class="clothing" draggable="true" id="item-accessory3" data-target="accessory">
	   <img src="accessory4.png" class="clothing" draggable="true" id="item-accessory4" data-target="accessory">
	   <img src="accessory5.png" class="clothing" draggable="true" id="item-accessory5" data-target="accessory">
	   <img src="accessory6.png" class="clothing" draggable="true" id="item-accessory6" data-target="accessory">
	   <img src="accessory7.png" class="clothing" draggable="true" id="item-accessory7" data-target="accessory">
	   <img src="accessory8.png" class="clothing" draggable="true" id="item-accessory8" data-target="accessory">
	   <img src="accessory9.png" class="clothing" draggable="true" id="item-accessory9" data-target="accessory">
	   <img src="accessory10.png" class="clothing" draggable="true" id="item-accessory10" data-target="accessory">
        </div>
      </div>

      <!-- 配飾：全部 target 設為 accessory -->

    <!-- 右側：人物 + 配飾區 -->
    <div id="right-panel">
      <!-- 人物 -->
      <div id="character-wrapper">
        <div class="char-title">請為小朋友換上合適的衣服</div>
        <div id="character">
          <div class="drop-zone" id="zone-head" data-accept="zone-head"></div>
          <div class="drop-zone" id="zone-body" data-accept="zone-body"></div>
          <div class="drop-zone" id="zone-legs" data-accept="zone-legs"></div>
          <div class="drop-zone" id="zone-glasses" data-accept="zone-glasses"></div>
        </div>
<button id="reset-btn">🔄 重置全部 / Reset</button> 
      </div>

      <!-- 配飾區 -->
      <div id="accessories-wrapper">
        <div class="char-title">隨身物品 / 配飾 / 鞋 </div>
        <!-- 接收所有配飾的大框框 -->
        <div class="drop-zone" id="zone-accessory" data-accept="accessory">
          <span style="color:#aaa; text-align:center; font-size:14px;">放這裡</span>
        </div>
      </div>
   </div>

  </div>

<script>
  const draggables = document.querySelectorAll('.clothing');
  const dropZones = document.querySelectorAll('.drop-zone');
  const wardrobe = document.getElementById('wardrobe');

draggables.forEach(item => {
    item.originalHome = item.parentElement;
});

  // 還原物品回到衣櫃時的樣式
  function resetClothingStyle(el) {
    el.style.width = '100%';
    el.style.height = 'auto';
    el.style.aspectRatio = '1 / 1'; 
    el.style.boxShadow = 'none';
    el.style.borderRadius = '8px';
    el.style.position = 'static'; // 觸控重置
    el.style.zIndex = '1';
  }

  // --- 1. 原本的電腦滑鼠拖拉事件 (保持不變) ---
  draggables.forEach(draggable => {
    draggable.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', draggable.id);
      setTimeout(() => { draggable.style.opacity = '0.5'; }, 0);
    });
    draggable.addEventListener('dragend', () => { draggable.style.opacity = '1'; });
  });

  dropZones.forEach(zone => {
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => { zone.classList.remove('drag-over'); });

    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const draggedId = e.dataTransfer.getData('text/plain');
      handleDropEvent(document.getElementById(draggedId), zone);
    });
  });

  wardrobe.addEventListener('dragover', (e) => { e.preventDefault(); });
  wardrobe.addEventListener('drop', (e) => {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const draggedElement = document.getElementById(draggedId);
    if (draggedElement) {
      wardrobe.appendChild(draggedElement);
      resetClothingStyle(draggedElement);
    }
  });


  // --- 2. 升級版 iPad/觸控螢幕拖拉與滾動事件 ---
  let activeTouchElement = null;
  let initialX = 0, initialY = 0;
  let startTouchX = 0, startTouchY = 0;
  let isDragging = false; // 記錄現在是否真的在拖拉

  draggables.forEach(draggable => {
    draggable.addEventListener('touchstart', (e) => {
      activeTouchElement = draggable;
      const touch = e.touches[0];
      startTouchX = touch.clientX;
      startTouchY = touch.clientY;
      isDragging = false;
      // 🌟 這裡先不把衣服浮起來，讓系統有時間判斷學生是想滾動還是拖拉
    }, { passive: true }); // 允許瀏覽器原生滾動

    draggable.addEventListener('touchmove', (e) => {
      if (!activeTouchElement) return;
      const touch = e.touches[0];
      
      const dx = touch.clientX - startTouchX;
      const dy = touch.clientY - startTouchY;

      if (!isDragging) {
        // 🌟 智能判斷 1：如果上下滑動較多，判定為「瀏覽衣櫃」
        if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10) {
          activeTouchElement = null; // 放棄拖拉，交給瀏覽器滾動
          return;
        }
        
        // 🌟 智能判斷 2：如果左右滑動較多，判定為「把衣服拉出來」
        if (Math.abs(dx) > 10) {
          isDragging = true;
          
          // 確定要拖拉了，這時才把衣服「拔」出來
          const rect = activeTouchElement.getBoundingClientRect();
          initialX = touch.clientX - rect.left;
          initialY = touch.clientY - rect.top;
          
          activeTouchElement.style.position = 'fixed';
          activeTouchElement.style.zIndex = '1000';
          activeTouchElement.style.width = rect.width + 'px';
          activeTouchElement.style.height = rect.height + 'px';
          activeTouchElement.style.opacity = '0.8';
        }
      }

      if (isDragging) {
        if (e.cancelable) e.preventDefault(); // 真正拖拉時，阻止畫面滾動
        activeTouchElement.style.left = (touch.clientX - initialX) + 'px';
        activeTouchElement.style.top = (touch.clientY - initialY) + 'px';
      }
    }, { passive: false });

    draggable.addEventListener('touchend', (e) => {
      if (!activeTouchElement) return;
      
      if (!isDragging) {
        // 如果只是普通點擊或滾動結束，什麼都不做
        activeTouchElement = null;
        return;
      }

      const touch = e.changedTouches[0];
      activeTouchElement.style.opacity = '1';
      activeTouchElement.style.display = 'none'; // 暫時隱藏以取得下方元素
      
      const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
      activeTouchElement.style.display = 'flex'; // 恢復顯示

      const dropZoneBelow = elementBelow ? elementBelow.closest('.drop-zone') : null;
      const characterBelow = elementBelow ? elementBelow.closest('#character') : null;

      if (dropZoneBelow || characterBelow) {
        handleDropEvent(activeTouchElement);
      } else {
        if (activeTouchElement.originalHome) {
            activeTouchElement.originalHome.appendChild(activeTouchElement);
        }
        resetClothingStyle(activeTouchElement);
      }
      
      activeTouchElement = null;
      isDragging = false;
    });
  });

  // --- 3. 整合處理「放置」邏輯 (智能吸附 + 支援多件配飾版) ---
  function handleDropEvent(draggedElement) {
    if (!draggedElement) return;
    
    // 讀取這件物品原本設定的目標
    const targetZoneId = draggedElement.getAttribute('data-target');
    const correctZone = document.querySelector(`.drop-zone[data-accept="${targetZoneId}"]`);

    if (correctZone) {
      
      // 🌟 關鍵修正：只有當目標「不是」配飾區時，才清空舊物品（衣服只能穿一件）
      if (correctZone.id !== 'zone-accessory') {
        Array.from(correctZone.children).forEach(child => {
          if (child.classList.contains('clothing')) {
            if (child.originalHome) {
              child.originalHome.appendChild(child);
            }
            resetClothingStyle(child);
          }
        });
      }
      
      const hint = correctZone.querySelector('span');
      if (hint) hint.remove(); 
      
      correctZone.appendChild(draggedElement);
      
      // 🌟 統一設定樣式
      draggedElement.style.position = 'static';
      draggedElement.style.width = '100%';
      draggedElement.style.boxShadow = 'none';
      draggedElement.style.borderRadius = '0';
      
      // 🌟 區分衣服與配飾的比例
      if (correctZone.id === 'zone-accessory') {
        // 配飾保持 1:1 正方形
        draggedElement.style.height = 'auto';
        draggedElement.style.aspectRatio = '1 / 1';
      } else {
        // 衣服填滿人物格仔
        draggedElement.style.height = '100%';
      }
      
    } else {
      // 找不到對應格仔，退回老家
      if (draggedElement.originalHome) {
        draggedElement.originalHome.appendChild(draggedElement);
      }
      resetClothingStyle(draggedElement);
    }
  }

// --- 4. 完美重置按鈕邏輯 ---
  const resetBtn = document.getElementById('reset-btn');

  resetBtn.addEventListener('click', () => {
    draggables.forEach(item => {
      // 🌟 直接將物品送回它剛載入時的「老家」（完全不會錯！）
      if (item.originalHome) {
        item.originalHome.appendChild(item);
      }
      // 還原大小與樣式
      resetClothingStyle(item);
    });
  });


</script>
</body>
</html>
