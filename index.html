<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>天氣穿衣小遊戲 - 完美放大版</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    /* 使用 dvh 以完美貼合 iOS Safari 工具列變化 */
    height: 100vh;
    height: 100dvh;
    overflow: hidden; /* 防止整個頁面外框被不小心拉動 */
    overscroll-behavior: none; /* 防止 iPad 邊緣回彈效果 */
    touch-action: none; /* 停用預設手勢 */
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f0f8ff;
    
    /* 置中排版 */
    display: flex; 
    flex-direction: column; 
    align-items: center; 
  }

  h1 { color: #333; margin-top: 15px; margin-bottom: 5px; }

  /* 🌟 遊戲主容器 */
  #game-container {
    display: flex; 
    gap: 30px; /* 稍微縮小間距適應平板 */
    margin-top: 10px;
    background: white; 
    padding: 20px; 
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    
    /* 🌟 iPad 適應關鍵：允許內容換行，高度不足時可在框內滑動 */
    flex-wrap: wrap; 
    justify-content: center;
    max-width: 98vw;
    max-height: 85dvh; 
    overflow-y: auto; 
    overflow-x: hidden;
    touch-action: pan-y; /* 允許在容器內上下滑動 */
  }

  /* 左側衣櫃區 */
  #wardrobe-wrapper {
    display: flex; 
    flex-direction: column; 
    align-items: center;
  }

  #wardrobe {
    width: 360px; /* 稍微收窄一點，讓 iPad 橫向更易放得落 */
    border: 3px dashed #ccc; border-radius: 10px;
    padding: 15px; background-color: #fafafa;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
    align-content: start;
    max-height: 600px; /* 配合 iPad 高度 */
    overflow-y: auto; 
    touch-action: pan-y; /* 🌟 確保衣櫃內部可以用手指上下滑動搵衫 */
  }

  /* 預防圖片變形的關鍵設定 */
  .clothing img, .drop-zone img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  /* 衣服項目 */
  .clothing {
    width: 100%; 
    aspect-ratio: 1 / 1; 
    border-radius: 8px; 
    cursor: grab; 
    user-select: none;
    transition: transform 0.2s;
    box-sizing: border-box;
    background-color: transparent; 
    display: flex; justify-content: center; align-items: center; 
    font-weight: bold; color: #555; font-size: 14px;
    /* 防止觸控拖拉時畫面捲動 */
    touch-action: none;
  }

  .clothing:active { 
    cursor: grabbing; 
    transform: scale(0.95);
    background-color: rgba(0,0,0,0.05); 
  }

  /* =========================================
     右側：人物 + 配飾區佈局
     ========================================= */
  #right-panel {
    display: flex; 
    gap: 30px; 
    align-items: flex-start;
    flex-wrap: wrap; /* 🌟 確保 iPad 直向時人物和配飾可以上下疊放 */
    justify-content: center;
  }

  #character-wrapper {
    display: flex; flex-direction: column; align-items: center;
  }

  .char-title { font-weight: bold; color: #333; margin-bottom: 15px; }

  #character {
    position: relative; 
    width: 396px;       
    height: 720px;      
    background-image: url('whole_body.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center top;
  }

  /* 隱形接收區 (通用設定) */
  .drop-zone {
    position: absolute; 
    display: flex; justify-content: center; align-items: center;
    box-sizing: border-box;
    transition: all 0.3s;
  }

  .drop-zone.drag-over {
    background-color: rgba(255, 243, 204, 0.7);
    border-color: #ff9f43; border-style: dashed;
  }

  /* 隱形格仔的位置 (保持不變) */
  #zone-head { 
    top: -100px; left: 46%; transform: translateX(-50%);
    width: 244px; height: 239px; z-index: 3;
  }
  #zone-body { 
    top: 150px; left: 50%; transform: translateX(-50%);
    width: 340px; height: 340px; z-index: 2;
  }
  #zone-legs { 
    top: 387px; left: 50%; transform: translateX(-50%);
    width: 287px; height: 287px; z-index: 1;
  }
  #zone-glasses { 
    top: 30px; left: 50%; transform: translateX(-50%);
    width: 178px; height: 178px; z-index: 4;
  }

  /* 配飾區 */
  #accessories-wrapper {
    display: flex; flex-direction: column; align-items: center;
  }

  #zone-accessory {
    position: static; 
    width: 250px; min-height: 720px; 
    border: 3px dashed #ccc; border-radius: 10px;
    background-color: #fdfdfd; padding: 15px;
    display: flex; flex-direction: column; gap: 15px;
    align-items: center; justify-content: flex-start;
  }
</style>

</head>
<body>

  <h1>🌤️ 天氣穿衣小遊戲</h1>
  
  <div id="game-container">
    <!-- 左側衣櫃 -->
    <div id="wardrobe-wrapper">
      <div class="char-title">衣櫃 (請拖拉)</div>
    	<div id="wardrobe">
	   <img src="1.png" class="clothing" draggable="true" id="item-hat1" data-target="zone-head">
	   <img src="2.png" class="clothing" draggable="true" id="item-hat2" data-target="zone-head">
	   <img src="3.png" class="clothing" draggable="true" id="item-hat3" data-target="zone-head">
	   <img src="tops1.png" class="clothing" draggable="true" id="item-shirt1" data-target="zone-body">
	   <img src="tops2.png" class="clothing" draggable="true" id="item-shirt2" data-target="zone-body">
	   <img src="tops3.png" class="clothing" draggable="true" id="item-shirt3" data-target="zone-body">
	   <img src="tops4.png" class="clothing" draggable="true" id="item-shirt4" data-target="zone-body">
	   <img src="tops5.png" class="clothing" draggable="true" id="item-shirt5" data-target="zone-body">
	   <img src="bottom1.png" class="clothing" draggable="true" id="item-pants1" data-target="zone-legs">
	   <img src="bottom2.png" class="clothing" draggable="true" id="item-pants2" data-target="zone-legs">
	   <img src="bottom3.png" class="clothing" draggable="true" id="item-pants3" data-target="zone-legs">
	   <img src="bottom4.png" class="clothing" draggable="true" id="item-pants4" data-target="zone-legs">
	   <img src="glasses1.png" class="clothing" draggable="true" id="item-glasses1" data-target="zone-glasses">
	   <img src="accessory1.png" class="clothing" draggable="true" id="item-accessory1" data-target="accessory">
	   <img src="accessory2.png" class="clothing" draggable="true" id="item-accessory2" data-target="accessory">
	   <img src="accessory3.png" class="clothing" draggable="true" id="item-accessory3" data-target="accessory">
	   <img src="accessory4.png" class="clothing" draggable="true" id="item-accessory4" data-target="accessory">
	   <img src="accessory5.png" class="clothing" draggable="true" id="item-accessory5" data-target="accessory">
	   <img src="accessory6.png" class="clothing" draggable="true" id="item-accessory6" data-target="accessory">
	   <img src="accessory7.png" class="clothing" draggable="true" id="item-accessory7" data-target="accessory">
	   <img src="accessory8.png" class="clothing" draggable="true" id="item-accessory8" data-target="accessory">
	   <img src="accessory9.png" class="clothing" draggable="true" id="item-accessory9" data-target="accessory">
	   <img src="accessory10.png" class="clothing" draggable="true" id="item-accessory10" data-target="accessory">
        </div>
      </div>

      <!-- 配飾：全部 target 設為 accessory -->

    <!-- 右側：人物 + 配飾區 -->
    <div id="right-panel">
      <!-- 人物 -->
      <div id="character-wrapper">
        <div class="char-title">小朋友</div>
        <div id="character">
          <div class="drop-zone" id="zone-head" data-accept="zone-head"></div>
          <div class="drop-zone" id="zone-body" data-accept="zone-body"></div>
          <div class="drop-zone" id="zone-legs" data-accept="zone-legs"></div>
          <div class="drop-zone" id="zone-glasses" data-accept="zone-glasses"></div>
        </div>
      </div>

      <!-- 配飾區 -->
      <div id="accessories-wrapper">
        <div class="char-title">隨身物品 / 配飾 / 鞋 </div>
        <!-- 接收所有配飾的大框框 -->
        <div class="drop-zone" id="zone-accessory" data-accept="accessory">
          <span style="color:#aaa; text-align:center; font-size:14px;">放這裡</span>
        </div>
      </div>
    </div>
  </div>

<script>
  const draggables = document.querySelectorAll('.clothing');
  const dropZones = document.querySelectorAll('.drop-zone');
  const wardrobe = document.getElementById('wardrobe');

  // 還原物品回到衣櫃時的樣式
  function resetClothingStyle(el) {
    el.style.width = '100%';
    el.style.height = 'auto';
    el.style.aspectRatio = '1 / 1'; 
    el.style.boxShadow = 'none';
    el.style.borderRadius = '8px';
    el.style.position = 'static'; // 觸控重置
    el.style.zIndex = '1';
  }

  // --- 1. 原本的電腦滑鼠拖拉事件 (保持不變) ---
  draggables.forEach(draggable => {
    draggable.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', draggable.id);
      setTimeout(() => { draggable.style.opacity = '0.5'; }, 0);
    });
    draggable.addEventListener('dragend', () => { draggable.style.opacity = '1'; });
  });

  dropZones.forEach(zone => {
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => { zone.classList.remove('drag-over'); });

    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const draggedId = e.dataTransfer.getData('text/plain');
      handleDropEvent(document.getElementById(draggedId), zone);
    });
  });

  wardrobe.addEventListener('dragover', (e) => { e.preventDefault(); });
  wardrobe.addEventListener('drop', (e) => {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const draggedElement = document.getElementById(draggedId);
    if (draggedElement) {
      wardrobe.appendChild(draggedElement);
      resetClothingStyle(draggedElement);
    }
  });


  // --- 2. 新增的 iPad/觸控螢幕拖拉事件 ---
  let activeTouchElement = null;
  let initialX = 0;
  let initialY = 0;

  draggables.forEach(draggable => {
    draggable.addEventListener('touchstart', (e) => {
      activeTouchElement = draggable;
      const touch = e.touches[0];
      const rect = draggable.getBoundingClientRect();
      
      // 計算手指點擊位置與圖片左上角的距離
      initialX = touch.clientX - rect.left;
      initialY = touch.clientY - rect.top;

      // 將元素設為絕對定位，讓它跟隨手指
      draggable.style.position = 'fixed';
      draggable.style.zIndex = '1000';
      draggable.style.width = rect.width + 'px';
      draggable.style.height = rect.height + 'px';
      draggable.style.left = (touch.clientX - initialX) + 'px';
      draggable.style.top = (touch.clientY - initialY) + 'px';
      draggable.style.opacity = '0.8';
    }, {passive: false});

    draggable.addEventListener('touchmove', (e) => {
      if (!activeTouchElement) return;
      e.preventDefault(); // 防止畫面滑動
      const touch = e.touches[0];
      
      // 更新元素位置
      activeTouchElement.style.left = (touch.clientX - initialX) + 'px';
      activeTouchElement.style.top = (touch.clientY - initialY) + 'px';
    }, {passive: false});

    draggable.addEventListener('touchend', (e) => {
      if (!activeTouchElement) return;
      const touch = e.changedTouches[0];
      activeTouchElement.style.opacity = '1';
      activeTouchElement.style.display = 'none'; // 暫時隱藏以取得下方元素
      
      // 找出手指放開時，下方的元素是哪一個
      const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
      activeTouchElement.style.display = 'flex'; // 恢復顯示

      // 檢查是否放置在 drop-zone 內
      const dropZoneBelow = elementBelow ? elementBelow.closest('.drop-zone') : null;
      const wardrobeBelow = elementBelow ? elementBelow.closest('#wardrobe') : null;

      if (dropZoneBelow) {
        handleDropEvent(activeTouchElement, dropZoneBelow);
      } else if (wardrobeBelow) {
        wardrobe.appendChild(activeTouchElement);
        resetClothingStyle(activeTouchElement);
      } else {
        // 沒有放到正確位置，退回衣櫃
        wardrobe.appendChild(activeTouchElement);
        resetClothingStyle(activeTouchElement);
      }
      activeTouchElement = null;
    });
  });

  // --- 3. 整合處理「放置」邏輯 ---
  function handleDropEvent(draggedElement, zone) {
    if (!draggedElement) return;
    
    const targetZoneId = draggedElement.getAttribute('data-target');
    const zoneAcceptId = zone.getAttribute('data-accept');

    if (targetZoneId === zoneAcceptId) {
      if (zoneAcceptId === 'accessory') {
          const hint = zone.querySelector('span');
          if(hint) hint.remove();
          
          zone.appendChild(draggedElement);
          // 配飾重置大小，並取消 fixed 定位
          draggedElement.style.position = 'static';
          draggedElement.style.width = '200px'; 
          draggedElement.style.height = 'auto';
          draggedElement.style.aspectRatio = '1 / 1';
          draggedElement.style.boxShadow = 'none';
      } else {
          // 衣服邏輯：將舊衣服送回衣櫃
          Array.from(zone.children).forEach(child => {
              if(child.classList.contains('clothing')){
                 wardrobe.appendChild(child);
                 resetClothingStyle(child);
              }
          });
          
          zone.appendChild(draggedElement);
          draggedElement.style.position = 'static';
          draggedElement.style.width = '100%';
          draggedElement.style.height = '100%';
          draggedElement.style.boxShadow = 'none';
          draggedElement.style.borderRadius = '0';
      }
    } else {
      alert('哎呀！呢件物品唔係放呢度㗎！');
      wardrobe.appendChild(draggedElement);
      resetClothingStyle(draggedElement);
    }
  }
</script>
</body>
</html>
